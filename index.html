<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLYSTVpro - Inicio</title>
    <style>
        body {
            background-color: #141414;
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            padding: 20px 30px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0));
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #E50914;
            letter-spacing: 1px;
        }
        .categoria-container {
            padding: 15px 25px;
        }
        @media (min-width: 600px) {
            .categoria-container {
                padding: 20px 40px;
            }
        }
        .categoria-titulo {
            font-size: 18px;
            margin-bottom: 12px;
            font-weight: bold;
            color: #e5e5e5;
        }
        .filas-elementos {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 15px;
            scrollbar-width: thin;
            scrollbar-color: #E50914 #141414;
        }
        .filas-elementos::-webkit-scrollbar {
            height: 6px;
        }
        .filas-elementos::-webkit-scrollbar-thumb {
            background: #E50914;
            border-radius: 3px;
        }
        .item-card {
            flex: 0 0 140px;
            background: #232323;
            border-radius: 6px;
            overflow: hidden;
            text-decoration: none;
            color: white;
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        @media (min-width: 600px) {
            .item-card {
                flex: 0 0 160px;
            }
        }
        .item-card:hover {
            transform: scale(1.08);
        }
        .item-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        @media (min-width: 600px) {
            .item-card img {
                height: 230px;
            }
        }
        .item-info {
            padding: 10px;
            font-size: 13px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">GLYSTVpro</div>
    </header>

    <div id="contenedor-principal">

        <!-- Fila Principal de Secciones -->
        <div class="categoria-container">
            <div class="categoria-titulo">Secciones y Contenidos</div>
            <div class="filas-elementos">
            

                <!-- Milenio -->
                <a href="milenio.html" class="item-card">
                    <img src="https://www.dropbox.com/scl/fi/eyycxeygf2ee0pssf9lay/milenio-4k.png?rlkey=o0teipsi2x25gcv6py0q0rshk&st=cy1ytwqn&dl=1" alt="Milenio">
                    <div class="item-info">Milenio</div>
                </a>
                
                <!-- Caracol TV -->
                <a href="caracol.html" class="item-card">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8a/Caracol_Televisi%C3%B3n_logo.svg/512px-Caracol_Televisi%C3%B3n_logo.svg.png" alt="Caracol TV">
                    <div class="item-info">Caracol TV</div>
                </a>
          
                
                <!-- Youtube -->
                <a href="youtube.html" class="item-card">
                    <img src="https://www.dropbox.com/scl/fi/uuth58c5avxmsb0pa0f10/Youtube.png?rlkey=4693nyczb47nwv46qdlfxp8fc&st=h5dru2s5&dl=1" alt="Youtube">
                    <div class="item-info">Youtube</div>
                </a>
                             
             
                <!-- Infantiles -->
                <a href="infantiles.html" class="item-card">
                    <img src="https://www.dropbox.com/scl/fi/u0whwrtfscxy4m9f9xido/infantiles.png?rlkey=kcitwxwwcxkbdem66htctpm44&st=xdhcpbkh&dl=1" alt="infantiles">
                    <div class="item-info">Infantiles</div>
                </a>



                <!-- historias-biblicas -->
                <a href="historia-biblicas.html" class="item-card">
                    <img src="https://www.dropbox.com/scl/fi/pm080bu3xw36m8mmwd2qo/historias-biblicas.png?rlkey=1p6mfovvqmj61eaz0g2of4vor&st=4v8rkwxw&dl=1" alt="Historias Bíblicas">
                    <div class="item-info">Historias Bíblicas</div>
                </a>

            </div>
        </div>

    </div>

</body>
</html>
