    const container = document.getElementById('content-sections');
    const player = document.getElementById('mainPlayer');
    const titleDisplay = document.getElementById('displayTitle');
    let currentIdx = -1;

    function renderContent(filter = 'all') {
        container.innerHTML = '';
        
        const categories = [
            { id: 'grizzy', title: '🐻 Grizzy & The Lemmings Vol. 2' },
            { id: 'larva', title: '🐛 Larva & Oscar - Películas y Capítulos' },
            { id: 'phineas', title: '⚙️ Phineas y Ferb - Canciones y Película' },
            { id: 'numberblocks', title: '🔢 Numberblocks - Matemáticas' },
            { id: 'kidslearning', title: '📚 Kids Learning TV & Inglés' }
        ];

        categories.forEach(cat => {
            if (filter !== 'all' && filter !== cat.id) return;
            
            const catVideos = allContent.filter(v => v.cat === cat.id);
            if (catVideos.length === 0) return;

            const sectionDiv = document.createElement('div');
            sectionDiv.innerHTML = `<div class="section-header">${cat.title}</div>`;
            
            const gridDiv = document.createElement('div');
            gridDiv.className = 'grid';

            catVideos.forEach((v) => {
                const globalIndex = allContent.indexOf(v);
                const card = document.createElement('div');
                card.className = 'card';
                
                let mediaHtml = v.type === 'img' 
                    ? `<img src="${v.img}" alt="${v.t}">` 
                    : `<div class="card-icon"><i class="fas ${v.i}"></i></div>`;

                let tagHtml = v.tag ? `<span class="tag">${v.tag}</span>` : '';

                card.innerHTML = `
                    ${mediaHtml}
                    <div class="card-info">
                        <div class="card-title">${v.t}</div>
                        ${tagHtml}
                    </div>
                `;
                card.onclick = () => playVideo(globalIndex);
                gridDiv.appendChild(card);
            });

            sectionDiv.appendChild(gridDiv);
            container.appendChild(sectionDiv);
        });
    }

    function filterCategory(cat) {
        document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        renderContent(cat);
    }

    function playVideo(index) {
        currentIdx = index;
        const item = allContent[index];
        player.src = item.u;
        player.play();
        titleDisplay.innerText = "Reproduciendo: " + item.t;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    player.onended = () => {
        if (currentIdx + 1 < allContent.length) {
            playVideo(currentIdx + 1);
        }
    };

    // Inicializar vista completa
    renderContent('all');
</script>
