<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>Milenio 4K TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
html,body{margin:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
header{position:sticky;top:0;z-index:20;background:rgba(5,5,5,.94);backdrop-filter:blur(14px);padding:14px 4vw;border-bottom:1px solid #222}
.top{display:flex;align-items:center;gap:18px;max-width:1500px;margin:auto}
.logo{font-size:25px;font-weight:900;letter-spacing:-1px;white-space:nowrap}
.logo span{font-weight:400}
.search{flex:1;max-width:650px;position:relative}
.search input{width:100%;padding:13px 18px 13px 44px;border:1px solid #333;border-radius:28px;background:#171717;color:#fff;outline:none;font-size:15px}
.search input:focus{border-color:#777}
.search:before{content:"⌕";position:absolute;left:17px;top:8px;font-size:25px;color:#aaa;z-index:1}
.count{color:#aaa;font-size:13px;white-space:nowrap}
main{max-width:1500px;margin:auto;padding:22px 4vw 60px}
.player-wrap{display:none;position:relative;margin-bottom:28px}
.player-box{background:#000;border-radius:16px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.55)}
video{display:block;width:100%;height:min(62vh,720px);background:#000}
.player-info{padding:12px 4px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.now{font-size:17px;font-weight:700}
.status{font-size:12px;color:#aaa}
.close{border:0;background:#222;color:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}
.categories{display:flex;gap:8px;overflow:auto;padding:4px 0 22px;scrollbar-width:thin}
.cat{border:1px solid #333;background:#151515;color:#ddd;border-radius:20px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.cat.active,.cat:hover{background:#fff;color:#000;border-color:#fff}
.section-title{font-size:23px;margin:8px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;align-items:start}
.card{background:#111;border:1px solid #222;border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s;min-width:0}
.card:hover{transform:translateY(-4px);border-color:#555;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.thumb{aspect-ratio:16/9;background:#1a1a1a;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
.thumb img{width:100%;height:100%;object-fit:contain;background:#111}
.fallback{font-size:34px;color:#777}
.card-body{padding:10px}
.name{font-size:14px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group{font-size:11px;color:#888;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:50px 10px;text-align:center;color:#888}
@media(max-width:700px){
  .top{gap:10px;flex-wrap:wrap}.logo{font-size:21px}.count{display:block;width:100%;order:4;text-align:left;font-size:13px}.search{order:3;flex-basis:100%}
  main{padding-top:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{min-height:0}.thumb{aspect-ratio:16/8.5}.card-body{padding:9px}.name{font-size:13px}.group{font-size:10px}
  video{height:28vh}.section-title{font-size:20px}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo">GLIS <span>TV</span></div>
    <div class="search"><input id="search" type="search" placeholder="Buscar canal..." autocomplete="off"></div>
    <div class="count" id="count"></div>
  </div>
</header>

<main>
  <section class="player-wrap" id="playerWrap">
    <div class="player-box">
      <video id="video" controls playsinline></video>
    </div>
    <div class="player-info">
      <div>
        <div class="now" id="now">Selecciona un canal</div>
        <div class="status" id="status">Reproductor HLS</div>
      </div>
      <button class="close" id="closeBtn">Cerrar</button>
    </div>
  </section>

  <div class="categories" id="categories"></div>
  <h2 class="section-title" id="title">Todos los canales</h2>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No se encontraron canales.</div>
</main>

const grid = document.getElementById('grid');
const categories = document.getElementById('categories');
const search = document.getElementById('search');
const title = document.getElementById('title');
const count = document.getElementById('count');
const empty = document.getElementById('empty');
const playerWrap = document.getElementById('playerWrap');
const video = document.getElementById('video');
const now = document.getElementById('now');
const statusEl = document.getElementById('status');
const closeBtn = document.getElementById('closeBtn');

let activeCategory = 'TODOS';
let hls = null;

const clean = s => (s || '').replace(/\s+/g,' ').trim();
const norm = s => clean(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

function shortGroup(g){
  return clean(g).replace(/^[^A-Za-zÁÉÍÓÚÜÑ0-9]+/,'').replace(/[^A-Za-zÁÉÍÓÚÜÑ0-9 )+-]+$/,'') || 'Otros';
}

const groups = [...new Set(CHANNELS.map(c => shortGroup(c.group)))].sort((a,b)=>a.localeCompare(b,'es'));

function renderCategories(){
  categories.innerHTML = '';
  ['TODOS', ...groups].forEach(g=>{
    const b=document.createElement('button');
    b.className='cat' + (g===activeCategory?' active':'');
    b.textContent=g;
    b.onclick=()=>{activeCategory=g; renderCategories(); render();};
    categories.appendChild(b);
  });
}

function filtered(){
  const q=norm(search.value);
  return CHANNELS.filter(c=>{
    const cg=shortGroup(c.group);
    const categoryOK=activeCategory==='TODOS' || cg===activeCategory;
    const name=norm(c.name), group=norm(cg);
    const text=name+' '+group;
    return categoryOK && (!q || text.includes(q));
  });
}

function card(c){
  const el=document.createElement('article');
  el.className='card';
  const thumb=document.createElement('div');
  thumb.className='thumb';
  if(c.logo){
    const img=document.createElement('img');
    img.loading='lazy'; img.alt='';
    img.src=c.logo;
    img.onerror=()=>{img.remove(); const f=document.createElement('div'); f.className='fallback'; f.textContent='▶'; thumb.appendChild(f);};
    thumb.appendChild(img);
  }else{
    const f=document.createElement('div'); f.className='fallback'; f.textContent='▶'; thumb.appendChild(f);
  }
  const body=document.createElement('div'); body.className='card-body';
  const n=document.createElement('div'); n.className='name'; n.title=c.name; n.textContent=c.name;
  const g=document.createElement('div'); g.className='group'; g.textContent=shortGroup(c.group);
  body.append(n,g); el.append(thumb,body);
  el.onclick=()=>play(c);
  return el;
}

function render(){
  const list=filtered();
  grid.innerHTML='';
  list.forEach(c=>grid.appendChild(card(c)));
  title.textContent = search.value.trim() ? 'Resultados de búsqueda' : (activeCategory==='TODOS' ? 'Todos los canales' : activeCategory);
  count.textContent = list.length + (list.length===1 ? ' canal' : ' canales');
  empty.hidden=list.length!==0;
}

function play(c){
  playerWrap.style.display='block';
  now.textContent=c.name;
  statusEl.textContent='Conectando…';
  window.scrollTo({top:0,behavior:'smooth'});

  if(hls){hls.destroy();hls=null;}
  video.pause();
  video.removeAttribute('src');
  video.load();

  const url=c.url;
  if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src=url;
    video.play().then(()=>statusEl.textContent='En vivo').catch(()=>statusEl.textContent='Pulsa ▶ para reproducir');
  }else if(window.Hls && Hls.isSupported()){
    hls=new Hls({enableWorker:true,lowLatencyMode:true});
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      video.play().then(()=>statusEl.textContent='En vivo').catch(()=>statusEl.textContent='Pulsa ▶ para reproducir');
    });
    hls.on(Hls.Events.ERROR,(event,data)=>{
      if(data.fatal) statusEl.textContent='No se pudo reproducir este canal';
    });
  }else{
    statusEl.textContent='Este navegador no soporta HLS';
  }
}

closeBtn.onclick=()=>{
  if(hls){hls.destroy();hls=null;}
  video.pause(); video.removeAttribute('src'); video.load();
  playerWrap.style.display='none';
};

search.addEventListener('input',render);

renderCategories();
render();
</script>
