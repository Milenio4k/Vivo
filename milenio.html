    <title>Milenio - Catálogo VOD y Series</title>

    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background-color: #0b0f19; color: #f8fafc; margin: 0; padding: 0; }
        
        header { height: 58px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #111827; border-bottom: 1px solid #263244; }
        header strong { color: #38bdf8; font-size: 18px; }
        
        .menu-buttons { display: flex; gap: 10px; }
        button { border: 0; border-radius: 8px; padding: 8px 14px; background: #1f2937; color: #fff; font-weight: 700; cursor: pointer; }
        button.active { background: #0284c7; }

        /* Contenedor del Reproductor Integrado */
        .player-container {
            max-width: 900px;
            margin: 20px auto;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: none;
        }
        video {
            width: 100%;
            max-height: 500px;
            display: block;
            background: #000;
        }
        .player-info {
            padding: 12px 20px;
            background: #1e293b;
            font-size: 15px;
            font-weight: 500;
            color: #38bdf8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .close-player {
            background: #ef4444;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .close-player:hover { background: #dc2626; }

        .controls { display: flex; justify-content: center; gap: 15px; margin: 20px 0; flex-wrap: wrap; padding: 0 20px; }
        input, select { padding: 10px 15px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 14px; width: 300px; max-width: 100%; }
        
        .vod-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; max-width: 1400px; margin: 0 auto 40px auto; padding: 0 20px; }
        .vod-card { background: #1e293b; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.4); transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; display: flex; flex-direction: column; position: relative; }
        .vod-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px rgba(56, 189, 248, 0.2); }
        
        .vod-number {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(2, 132, 199, 0.9);
            color: white;
            font-size: 12px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            z-index: 2;
        }

        .vod-poster { width: 100%; height: 260px; object-fit: cover; background: #334155; }
        .vod-info { padding: 12px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
        .vod-title { font-size: 13px; font-weight: 600; margin: 0 0 8px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .vod-meta { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .vod-badge { padding: 2px 6px; font-size: 10px; font-weight: bold; background: #0284c7; color: white; border-radius: 4px; }
        .vod-genre { font-size: 11px; color: #94a3b8; }

        /* Estilos del Modal de Episodios */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px;
        }
        .modal-content {
            background: #111827; border: 1px solid #334155; width: 100%; max-width: 700px;
            max-height: 85vh; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden;
        }
        .modal-header { padding: 15px 20px; background: #1e293b; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; color: #38bdf8; font-size: 16px; }
        .modal-body { padding: 20px; overflow-y: auto; }
        .episode-list { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .episode-item {
            display: flex; align-items: center; gap: 15px; background: #1e293b; padding: 10px;
            border-radius: 6px; cursor: pointer; transition: background 0.2s; border: 1px solid transparent;
        }
        .episode-item:hover { background: #334155; border-color: #0284c7; }
        .episode-thumb { width: 100px; height: 60px; object-fit: cover; border-radius: 4px; background: #000; }
        .episode-details h4 { margin: 0 0 5px 0; font-size: 14px; color: #f8fafc; }
        .episode-details span { font-size: 12px; color: #38bdf8; }
    </style>
</head>

            <div class="modal-body">

        </div>
    </div>

        let seccionActual = 'peliculas';

        function renderizarGrid(items) {
            const grid = document.getElementById('vod-grid');
            grid.innerHTML = '';
            
            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'vod-card';
                
                if (seccionActual === 'peliculas') {
                    card.onclick = () => reproducirPelicula(item);
                } else {
                    card.onclick = () => abrirModalTemporada(item);
                }

                card.innerHTML = `
                    <div class="vod-number">#${index + 1}</div>
                    <img class="vod-poster" src="${item.poster}" alt="${item.titulo}" loading="lazy">
                    <div class="vod-info">
                        <div class="vod-title">${item.titulo}</div>
                        <div class="vod-meta">
                            <span class="vod-badge">${item.calidad}</span>
                            <span class="vod-genre">${item.genero}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function reproducirPelicula(pelicula) {
            const container = document.getElementById('playerContainer');
            const video = document.getElementById('videoPlayer');
            const titleSpan = document.getElementById('nowPlayingTitle');

            titleSpan.textContent = `Reproduciendo: ${pelicula.titulo}`;
            video.src = pelicula.url;
            container.style.display = 'block';
            video.play();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function abrirModalTemporada(temporadaItem) {
            document.getElementById('modalSeriesTitle').textContent = temporadaItem.titulo;
            const episodesContainer = document.getElementById('episodesContainer');
            episodesContainer.innerHTML = '';

            temporadaItem.episodios.forEach((ep) => {
                const item = document.createElement('div');
                item.className = 'episode-item';
                item.onclick = () => {
                    reproducirEpisodio(ep);
                    cerrarModal();
                };

                item.innerHTML = `
                    <img class="episode-thumb" src="${ep.posterUrl}" loading="lazy">
                    <div class="episode-details">
                        <h4>${ep.title}</h4>
                        <span>Reproducir Episodio</span>
                    </div>
                `;
                episodesContainer.appendChild(item);
            });

            document.getElementById('seriesModal').style.display = 'flex';
        }

        function reproducirEpisodio(ep) {
            const container = document.getElementById('playerContainer');
            const video = document.getElementById('videoPlayer');
            const titleSpan = document.getElementById('nowPlayingTitle');

            titleSpan.textContent = `Reproduciendo: ${ep.title}`;
            video.src = ep.videoUrl;
            container.style.display = 'block';
            video.play();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cerrarModal() {
            document.getElementById('seriesModal').style.display = 'none';
        }

        function cerrarReproductor() {
            const container = document.getElementById('playerContainer');
            const video = document.getElementById('videoPlayer');
            video.pause();
            video.src = '';
            container.style.display = 'none';
        }

        function filtrarContenido() {
            const texto = document.getElementById('searchInput').value.toLowerCase();
            const generoSeleccionado = document.getElementById('genreSelect').value;

            const baseDatos = seccionActual === 'peliculas' ? listaPeliculasVOD : listaSeriesVOD;

            const filtradas = baseDatos.filter(item => {
                const coincideTexto = item.titulo.toLowerCase().includes(texto);
                const coincideGenero = generoSeleccionado === "" || item.genero.includes(generoSeleccionado);
                return coincideTexto && coincideGenero;
            });

            renderizarGrid(filtradas);
        }

        function cambiarSeccion(seccion) {
            seccionActual = seccion;
            document.getElementById('moviesBtn').classList.toggle('active', seccion === 'peliculas');
            document.getElementById('seriesBtn').classList.toggle('active', seccion === 'series');
            
            document.getElementById('searchInput').value = '';
            document.getElementById('genreSelect').value = '';

            const baseDatos = seccion === 'peliculas' ? listaPeliculasVOD : listaSeriesVOD;
            renderizarGrid(baseDatos);
        }

        // Inicializar cargando las películas
        renderizarGrid(listaPeliculasVOD);
    </script>
